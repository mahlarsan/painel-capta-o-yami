name: Atualizar editais
on:
  schedule: [{cron: "0 11 * * 1-5"}]   # dias úteis, 8h em Brasília
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python scraper.py
      - run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add data/editais.json && (git diff --staged --quiet || git commit -m "Atualiza editais") && git push
